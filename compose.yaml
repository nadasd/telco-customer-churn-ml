services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: telco-churn-mlflow:1.0.0

    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/mlartifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"

    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*"

    volumes:
      - type: bind
        source: ./mlflow.db
        target: /mlflow/mlflow.db
      - type: bind
        source: ./mlartifacts
        target: /mlflow/mlartifacts

    ports:
      - "5000:5000"

    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: telco-churn-api:1.0.0

    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MODEL_URI: "models:/TelcoChurnXGBoost/2"

    ports:
      - "8000:8000"

    depends_on:
      mlflow:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
