name: ML Pipeline Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download and verify the reference dataset
        run: |
          mkdir -p data/raw
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/d5371f5d83a446ad5673cbcca3b814b926491f8a/data/Telco-Customer-Churn.csv \
            --output data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
          echo "16320c9c1ec72448db59aa0a26a0b95401046bef5d02fd3aeb906448e3055e91  data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv" | sha256sum --check -

      - name: Start MLflow server
        run: |
          mkdir -p mlartifacts
          nohup mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --artifacts-destination ./mlartifacts \
            --host 127.0.0.1 \
            --port 5000 \
            --workers 1 > mlflow-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 2
          done
          cat mlflow-server.log
          exit 1

      - name: Run the complete training pipeline
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: python scripts/run_pipeline.py
